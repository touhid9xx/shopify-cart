[project]
name = "shopify-cart"
version = "0.1.0"
description = "E-commerce backend with ML-powered product auto-categorization"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Your Name", email = "you@example.com" }]

dependencies = [
    # Web
    "fastapi==0.115.5",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic==2.9.2",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",

    # Auth
    "pyjwt>=2.10.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",

    # Logging
    "structlog>=24.4.0",

    # Kafka
    "aiokafka>=0.12.0",

    # ML / Data
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "datasets>=3.1.0",
    "huggingface-hub>=0.27.0",
    "pillow>=11.0.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "mlflow>=2.19.0",
    "optuna>=4.1.0",

    # UI
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ─── Ruff ───────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/**" = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ───────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# ── Core strict mode ──
strict = true

# ── Extra strictness beyond strict ──
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true

# ── Output ──
show_error_codes = true
show_error_context = true
pretty = true

# ── Third-party libraries that lack type stubs ──
[[tool.mypy.overrides]]
module = [
    # ML / Data — no complete stubs
    "aiokafka.*",
    "datasets.*",
    "huggingface_hub.*",
    "matplotlib.*",
    "mlflow.*",
    "numpy.*",
    "optuna.*",
    "pandas.*",
    "passlib.*",
    "PIL.*",
    "sklearn.*",
    "streamlit.*",
    "torch.*",
    "torchvision.*",
]
ignore_missing_imports = true

# ── Relax strict rules for ML code (dynamic library APIs) ──
[[tool.mypy.overrides]]
module = "shopify_cart.ml.*"
disallow_any_generics = false
disallow_subclassing_any = false
warn_return_any = false

# ── Tests can be less strict (fixtures, one-liners) ──
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─── Pytest ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "unit: unit tests (fast, no external services)",
    "integration: integration tests (may need DB, Kafka, etc.)",
    "slow: slow tests (ML training, dataset download)",
]
