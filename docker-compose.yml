# shopify-cart/docker-compose.yml (ROOT)

services:
  # ═══════════════════════════════════════════════════════════════
  # App (FastAPI + Uvicorn)
  # ═══════════════════════════════════════════════════════════════
  app:
    build:
      context: ./backend            # ← CHANGED: from root
      dockerfile: Dockerfile
    container_name: shopify-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Tushar@007}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopify_cart}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - ./backend/data/uploads:/app/data/uploads
      - ./backend/data/logs:/app/logs
    networks:
      - shopify


  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: ./frontend           # ← CHANGED: from root
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    container_name: shopify-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://app:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NODE_ENV: production
    depends_on:
      app:
        condition: service_healthy
    networks:
      - shopify


  # ---------------------------------------------------------------
  # MySQL 8
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shopify-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Tushar@007
      MYSQL_DATABASE: shopify_cart
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shopify
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # Zookeeper
  # ---------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: shopify-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - shopify
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: shopify-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - shopify
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------
  # MLflow
  # ---------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: shopify-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/mlruns:/mlruns
      - ./backend/mlartifacts:/mlartifacts
    networks:
      - shopify
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////mlruns/mlflow.db
        --default-artifact-root mlflow-artifacts:/
        --serve-artifacts
        --artifacts-destination /mlartifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  shopify:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local
